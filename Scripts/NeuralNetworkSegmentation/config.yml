model:
  name: "UNet2D" # Model architecture to build. Supported here: UNet2D, UNet3D.
  in_channels: 1 # Number of image channels given to the network.
  out_channels: 2 # Number of output classes predicted by the final layer.
  features: 32 # Base number of feature maps; larger values increase model capacity and memory use.
  use_batchnorm: True # Whether convolution blocks include batch normalization.
  dropout_rate: 0.0 # Dropout probability used in the model blocks.

optimizer:
  name: "Adam" # Optimizer to use. Check optimizer.py for the supported names and arguments.
  lr: 0.0001 # Learning rate.
  weight_decay: 0 # L2 regularization strength applied by the optimizer.

lr_scheduler:
  name: "StepLR" # Learning-rate scheduler applied during training.
  step_size: 100 # Number of epochs between LR drops.
  gamma: 0.1 # Multiplicative factor applied when the scheduler steps.

loss_criterion:
  name: "DiceCELoss" # Loss function to build. Supported names depend on loss.py.
  include_background: True # Whether the background class contributes to the Dice term.
  lambda_dice: 0.7 # Weight of the Dice part inside DiceCELoss.
  lambda_ce: 0.3 # Weight of the Cross Entropy part inside DiceCELoss.
  smooth: 1.0 # Smoothing constant added to the Dice numerator/denominator for stability.

eval_criterion:
  name: "BlobsAveragePrecision"
  input_channel: 1
  threshold: 0.5 
  iou_threshold: 0.5
  min_instance_size: null
  metric: "precision"

data:
  raw_path: "/home/MockDataset/inputs" # Path to the input images used for training.
  channels_to_load: [0] # Channel indices to load from each image.
  label_path: "/home/MockDataset/masks" # Path to the segmentation masks matching the input images.
  
  split_train: 0.6 # Fraction of the dataset assigned to the training split.
  split_validation: 0.2 # Fraction of the dataset assigned to the validation split.
  split_test: 0.2 # Fraction of the dataset assigned to the test split.
  
  batch_size: 32
  num_workers: 1

transforms:

  data_generation:
    generate_data: False # Whether to create a generated dataset before training.
    num_images: 15 # Number of images/events to generate when data generation is enabled.

  train:

    raw:
      RandomAffine:
        degrees: 180
        translate:  [0.2, 0.2]
        scale:  [0.85, 1.15]
        shear:  [-8, 8]

      GaussianBlur:
        kernel: 3
        sigma:  [0.1, 1.5]
        blur_probability: 0.3
      
      CenterCrop:
        size: 128

      AdjustBrightness:
        brightness: [0.5, 2]
        same_channels_brightness: False
      

    label:
      RandomAffine:
        degrees: 180
        translate: [0.2, 0.2]
        scale: [0.85, 1.15]
        shear: [-8, 8]

      CenterCrop:
        size: 128
      
  
  val:
    raw:
      CenterCrop:
        size: 128

    label:
      CenterCrop:
        size: 128

  test:
    raw:
      CenterCrop:
        size: 128


    label:
      CenterCrop:
        size: 128

num_epochs: 50

save_point:
  out_dir: "/data/joao/Materials/Joao_repository/mTB_segmentation/testing_config_run"
  out_model_name: "model_1"
    