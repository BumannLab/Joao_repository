model:
  name: "UNet3D" # Model architecture to build. Supported here: UNet2D, UNet3D.
  in_channels: 1 # Number of image channels given to the network.
  out_channels: 1 # Number of output classes predicted by the final layer.
  f_maps: [32, 64, 128] # Base number of feature maps; larger values increase model capacity and memory use.
  act: RELU
  norm: BATCH # Whether convolution blocks include batch normalization.
  dropout: 0.1

optimizer:
  name: Adam # Optimizer to use. Check optimizer.py for the supported names and arguments.
  lr: 0.002 # Learning rate.
  weight_decay: 0 # L2 regularization strength applied by the optimizer.

# lr_scheduler:
#   name: StepLR
#   step_size: 100
#   gamma: 0.1

loss_criterion:
  name: DiceFocalLoss
  sigmoid: True
  smooth_nr: 0.00001
  smooth_dr: 0.00001
  gamma: 1
  lambda_dice: 0.5
  lambda_focal: 0.5
  smooth: 1.0

eval_criterion:
  name: SoftDice
  mode: sigmoid
  include_background: True

trainer:
  checkpoint_dir: "Results/NeuralNetworkSegmentationModels"
  max_num_epochs: 5
  log_after_epochs: 1
  max_val_images: 100
  
loaders:
  dataset: standard
  
  channels_to_load: [0]

  batch_size: 1
  num_workers: 1

  seed: 47

  train:
    raw_path: Test_augmentations/MockDataset/train/input # Path to the input images used for training.
    label_path: Test_augmentations/MockDataset/train/label # Path to the segmentation masks matching the input images.

    generate_data: False # Whether to create a generated dataset before training.
    num_images: 15 # Number of images/events to generate when data generation is enabled.

    transforms:
      - name: ToFloat
        max_value: 65535
      - name: CenterCrop
        height: 128
        width: 128
      - name: PadIfNeeded3D
        min_zyx: [24, 128, 128]
      - name: ToTensor3D

  val:
    raw_path: Test_augmentations/MockDataset/validation/input
    label_path: Test_augmentations/MockDataset/validation/label
    
    transforms:
      - name: ToFloat
        max_value: 65535
      - name: PadIfNeeded3D
        min_zyx: [24, 256, 256]
      - name: ToTensor3D
  

device: cuda